<script>
// PDF COMPRESSOR ENGINE v2 (fixes: buffer detach, original page size, huge-page memory clamp, password message)
pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

const PRESETS = {
    eco:      { scale: 1.0, quality: 0.35 },
    balanced: { scale: 1.2, quality: 0.55 },
    hd:       { scale: 1.5, quality: 0.78 },
    ultrahd:  { scale: 2.0, quality: 0.92 }
};
const MAX_PIXELS = 12000000; // protects phones from canvas memory limits

let currentFile = null, compressedBlob = null, selectedPreset = 'balanced', useGrayscale = false, useManual = false;

const $ = id => document.getElementById(id);
const fileInput = $('fileInput'), dropZone = $('dropZone'), fileInfoBar = $('fileInfoBar'),
      fileName = $('fileName'), fileMeta = $('fileMeta'), removeBtn = $('removeBtn'),
      vectorWarning = $('vectorWarning'), controls = $('controls'), toggleGray = $('toggleGrayscale'),
      toggleManEl = $('toggleManual'), manualQualDiv = $('manualQuality'), qualityRange = $('qualityRange'),
      sliderVal = $('sliderVal'), compressBtn = $('compressBtn'), progressWrap = $('progressWrap'),
      progressStage = $('progressStage'), progressPct = $('progressPct'), progressFill = $('progressFill'),
      pageTiles = $('pageTiles'), resultCard = $('resultCard'), resultTitle = $('resultTitle'),
      origSizeEl = $('origSize'), newSizeEl = $('newSize'), savedPctEl = $('savedPct'), savedChip = $('savedChip'),
      sizeWarning = $('sizeWarning'), sizeWarningTxt = $('sizeWarningText'), downloadBtn = $('downloadBtn'),
      compressAgain = $('compressAgainBtn');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && (f.type === 'application/pdf' || /\.pdf$/i.test(f.name))) loadFile(f);
    else alert('Please drop a valid PDF file.');
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
removeBtn.addEventListener('click', resetTool);
compressBtn.addEventListener('click', processPDF);
compressAgain.addEventListener('click', resetTool);
document.querySelectorAll('.preset-btn').forEach(btn => btn.addEventListener('click', () => selectPreset(btn.dataset.preset)));
toggleGray.addEventListener('click', () => { useGrayscale = !useGrayscale; toggleGray.classList.toggle('active', useGrayscale); });
toggleManEl.addEventListener('click', () => {
    useManual = !useManual;
    toggleManEl.classList.toggle('active', useManual);
    manualQualDiv.classList.toggle('show', useManual);
});
qualityRange.addEventListener('input', () => { sliderVal.textContent = parseFloat(qualityRange.value).toFixed(2); });

function readError(err) {
    if (err && (err.name === 'PasswordException' || /password/i.test(err.message || '')))
        return 'This PDF is password-protected. Remove the password first, then try again.';
    return 'Could not process this PDF. It may be corrupted.\n\n' + ((err && err.message) || '');
}

async function loadFile(file) {
    currentFile = file;
    compressedBlob = null;
    try {
        const data = new Uint8Array(await file.arrayBuffer()); // pdf.js takes ownership of this buffer
        const pdfDoc = await pdfjsLib.getDocument({ data }).promise;
        const numPages = pdfDoc.numPages;
        const kbPerPage = (file.size / 1024) / numPages;
        if (kbPerPage < 40) { vectorWarning.classList.add('show'); selectPreset('eco'); }
        else vectorWarning.classList.remove('show');
        fileName.textContent = file.name;
        fileMeta.textContent = `${numPages} page${numPages > 1 ? 's' : ''} · ${(file.size / 1024 / 1024).toFixed(2)} MB · ~${Math.round(kbPerPage)} KB/page`;
        fileInfoBar.classList.add('show');
        controls.style.display = 'block';
        resultCard.classList.remove('show');
        progressWrap.classList.remove('show');
        pdfDoc.destroy();
    } catch (err) {
        console.error('loadFile error:', err);
        currentFile = null;
        alert(readError(err));
    }
}

function selectPreset(name) {
    selectedPreset = name;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    const t = document.querySelector(`[data-preset="${name}"]`);
    if (t) t.classList.add('active');
}

function resetTool() {
    currentFile = null; compressedBlob = null; fileInput.value = '';
    fileInfoBar.classList.remove('show');
    controls.style.display = 'none';
    resultCard.classList.remove('show');
    progressWrap.classList.remove('show');
    vectorWarning.classList.remove('show');
    sizeWarning.classList.remove('show');
    useGrayscale = false; useManual = false;
    toggleGray.classList.remove('active'); toggleManEl.classList.remove('active'); manualQualDiv.classList.remove('show');
    selectPreset('balanced');
}

function setProgress(text, pct) {
    progressStage.textContent = text;
    progressPct.textContent = Math.round(pct) + '%';
    progressFill.style.width = Math.round(pct) + '%';
}
function markTile(n, state) {
    const el = document.getElementById(`tile-${n}`);
    if (!el) return;
    el.classList.remove('done', 'current');
    el.classList.add(state);
}
function fmtSize(bytes) {
    const kb = bytes / 1024;
    return kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.round(kb) + ' KB';
}

async function processPDF() {
    if (!currentFile) return;
    const cfg = PRESETS[selectedPreset];
    const scale = cfg.scale;
    const quality = useManual ? parseFloat(qualityRange.value) : cfg.quality;

    compressBtn.disabled = true;
    progressWrap.classList.add('show');
    resultCard.classList.remove('show');
    setProgress('Loading PDF…', 2);

    try {
        const data = new Uint8Array(await currentFile.arrayBuffer()); // fresh copy every run
        const pdfDoc = await pdfjsLib.getDocument({ data }).promise;
        const total = pdfDoc.numPages;

        pageTiles.innerHTML = '';
        const maxTiles = Math.min(total, 60);
        for (let i = 1; i <= maxTiles; i++) {
            const t = document.createElement('div');
            t.className = 'page-tile'; t.id = `tile-${i}`; t.textContent = i;
            pageTiles.appendChild(t);
        }
        if (total > maxTiles) {
            const more = document.createElement('div');
            more.className = 'page-tile'; more.textContent = `+${total - maxTiles}`;
            pageTiles.appendChild(more);
        }

        const outPdf = await PDFLib.PDFDocument.create();

        for (let i = 1; i <= total; i++) {
            setProgress(`Compressing page ${i} of ${total}…`, 5 + (i / total) * 88);
            if (i > 1 && (i - 1) <= maxTiles) markTile(i - 1, 'done');
            if (i <= maxTiles) markTile(i, 'current');

            const page = await pdfDoc.getPage(i);
            const base = page.getViewport({ scale: 1 });          // original page size in PDF points
            let viewport = page.getViewport({ scale });
            const px = viewport.width * viewport.height;
            if (px > MAX_PIXELS) viewport = page.getViewport({ scale: scale * Math.sqrt(MAX_PIXELS / px) });

            const canvas = document.createElement('canvas');
            canvas.width = Math.round(viewport.width);
            canvas.height = Math.round(viewport.height);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            await page.render({ canvasContext: ctx, viewport }).promise;
            page.cleanup();

            if (useGrayscale) {
                const img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
                for (let p = 0; p < d.length; p += 4) {
                    const g = Math.round(0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2]);
                    d[p] = d[p + 1] = d[p + 2] = g;
                }
                ctx.putImageData(img, 0, 0);
            }

            const b64 = canvas.toDataURL('image/jpeg', quality).split(',')[1];
            const bin = atob(b64);
            const imgBytes = new Uint8Array(bin.length);
            for (let b = 0; b < bin.length; b++) imgBytes[b] = bin.charCodeAt(b);

            const embedded = await outPdf.embedJpg(imgBytes);
            const newPage = outPdf.addPage([base.width, base.height]);   // same page size as the original
            newPage.drawImage(embedded, { x: 0, y: 0, width: base.width, height: base.height });

            canvas.width = 1; canvas.height = 1;
        }

        if (total <= maxTiles) markTile(total, 'done');
        setProgress('Finalizing…', 97);
        pdfDoc.destroy();

        const finalBytes = await outPdf.save();
        const candidateBlob = new Blob([finalBytes], { type: 'application/pdf' });
        setProgress('Done ✅', 100);

        const alreadyOptimal = candidateBlob.size >= currentFile.size;
        compressedBlob = alreadyOptimal ? currentFile : candidateBlob;  // File is a Blob; no stale buffer
        showResult(alreadyOptimal);
    } catch (err) {
        console.error('Compression error:', err);
        progressWrap.classList.remove('show');
        alert(readError(err));
    } finally {
        compressBtn.disabled = false;
    }
}

function showResult(alreadyOptimal) {
    const savedPc = Math.round((1 - compressedBlob.size / currentFile.size) * 100);
    origSizeEl.textContent = fmtSize(currentFile.size);
    newSizeEl.textContent = fmtSize(compressedBlob.size);
    if (alreadyOptimal) {
        savedPctEl.textContent = '0%';
        savedChip.style.borderColor = '#fde68a'; savedChip.style.background = '#fffbeb'; savedPctEl.style.color = '#b45309';
        sizeWarningTxt.innerHTML =
            '<strong>This PDF is already fully optimised!</strong><br>' +
            'It appears to be a digital/vector document (created from Word, Google Docs, etc.) ' +
            'rather than a scanned image — rasterization would only increase its size. ' +
            'We are giving you back the <strong>original file unchanged</strong>.';
        sizeWarning.classList.add('show');
        resultTitle.textContent = '✅ Already Optimal!';
        downloadBtn.innerHTML = '<i class="fa fa-download"></i> Download Original (Unchanged)';
        downloadBtn.style.background = '#f59e0b';
    } else {
        savedPctEl.textContent = savedPc + '%';
        savedChip.style.borderColor = '#a7f3d0'; savedChip.style.background = 'white'; savedPctEl.style.color = 'var(--success)';
        sizeWarning.classList.remove('show');
        resultTitle.textContent = '✅ Compression Complete!';
        downloadBtn.innerHTML = '<i class="fa fa-download"></i> Download Compressed PDF';
        downloadBtn.style.background = 'var(--success)';
    }
    resultCard.classList.add('show');
    const safeName = currentFile.name.replace(/\.pdf$/i, '');
    const prefix = alreadyOptimal ? 'Original' : `Toolvala_${selectedPreset}`;
    downloadBtn.onclick = () => download(compressedBlob, `${prefix}_${safeName}.pdf`, 'application/pdf');
}

document.querySelectorAll('[data-faq]').forEach(el => el.addEventListener('click', () => el.closest('.faq-item').classList.toggle('open')));
</script>
